name: Probe
on:
  push:
    branches: [probe]
    paths: [probe/probe.mjs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node probe/probe.mjs
      - run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add probe/out && git commit -m "probe output" && git push
