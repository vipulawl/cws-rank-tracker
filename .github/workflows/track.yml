name: Track rankings

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch: {}
  push:
    paths:
      - docs/config.json    # re-run right away when keywords/markets change

permissions:
  contents: write

concurrency:
  group: track-${{ github.ref }}
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Search the Chrome Web Store
        run: node scripts/track.mjs
        env:
          CONCURRENCY: "4"

      - name: Save results
        if: always()
        run: |
          git config user.name "rank-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: rankings $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
